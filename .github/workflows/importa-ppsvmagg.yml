name: Importazione PPSVMAGG del mattino

# Importa nel database i PPSVMAGG che la edge function sftp-messaggerie ha scaricato tra le 5:30 e
# le 7:30. GitHub usa l'ora UTC e non garantisce gli orari programmati: nelle ore di carico li
# ritarda o li salta (il 20/10/2026 il passaggio delle 6:15 UTC non è mai partito). Per questo ci
# sono più passaggi, su minuti poco affollati, dalle 8 alle 11 italiane con l'ora legale (dalle 7
# alle 10 con la solare). Lo script parte solo dopo le 8:00 italiane e importa soltanto ciò che
# manca: se è già tutto dentro, esce in pochi secondi.
# Dal 21/10/2026 il workflow lo avvia soprattutto Supabase (pg_cron "msg-import-avvia" → msg_import_avvia,
# ogni 20 minuti dalle 4 alle 9 UTC, solo se ci sono file da importare): l'avvio manuale parte subito.
# Gli orari qui sotto restano come riserva.
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "47 6 * * *"
    - cron: "17 7 * * *"
    - cron: "47 7 * * *"
    - cron: "47 8 * * *"
    - cron: "47 9 * * *"
  workflow_dispatch:

concurrency:
  group: importa-ppsvmagg
  cancel-in-progress: false

jobs:
  importa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Importa i PPSVMAGG scaricati
        run: node --max-old-space-size=4096 scripts/importa-ppsvmagg.mjs
        env:
          MSG_IMPORT_CRON_KEY: ${{ secrets.MSG_IMPORT_CRON_KEY }}
          FORZA: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
